services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rilian
      POSTGRES_USER: rilian
      POSTGRES_PASSWORD: rilian-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rilian -d rilian"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
