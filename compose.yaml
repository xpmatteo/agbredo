services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agbredo
      POSTGRES_USER: agbredo
      POSTGRES_PASSWORD: agbredo-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agbredo -d agbredo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
