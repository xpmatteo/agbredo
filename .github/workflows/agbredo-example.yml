name: Agbredo example agent

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "claude: a real Claude Code step; otlp: made-up telemetry, no model"
        type: choice
        default: claude
        options: [claude, otlp]

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for the OIDC token that gets its telemetry token

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The telemetry step goes right before the Claude Code step and names it.
      # A workflow with several Claude Code steps puts one before each, with a different source name for each.
      # In another repository, use xpmatteo/agbredo/integrations/claude-code-otlp@main instead of the local path.
      - name: Get a telemetry token
        uses: ./integrations/claude-code-otlp
        with:
          url: ${{ vars.AGBREDO_URL }}
          agent-id: ${{ vars.AGBREDO_AGENT_ID }}
          source: ${{ inputs.scenario == 'otlp' && 'pretend-claude' || 'claude-hi' }}
      # For "otlp" only: pretends to be Claude Code and sends made-up telemetry, including one repeated export.
      - name: Send made-up telemetry
        if: inputs.scenario == 'otlp'
        run: python3 examples/fake-telemetry/send.py
      # For "claude" only: a real Claude Code step. It needs the CLAUDE_CODE_OAUTH_TOKEN secret.
      - name: Claude Code says hi
        if: inputs.scenario == 'claude'
        uses: anthropics/claude-code-action@c2d289cca71cda091794983294573dd33f0f6e7a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: Say hi in one short sentence. Do not use any tools.
          claude_args: --max-turns 1
