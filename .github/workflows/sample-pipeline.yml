# Sample Pipeline, for testing Agbredo.
# The Agent writes content (a haiku file, issue and PR text).
# Deterministic Steps open the Issue and the PR, add the Agbredo-Run marker
# and the ai-agent-generated label.
# Claude Code sends its telemetry to Agbredo, which forwards it to OpenObserve.
# The job proves who it is with a GitHub OIDC token, so the repository that
# uses this Pipeline needs no telemetry secret.
#
# This is a reusable workflow, started by sample.yml. Agbredo only shows runs
# whose workflow_run webhook has a non-empty referenced_workflows, and GitHub
# fills that list only when a workflow calls a reusable one. So the work lives
# here (the Pipeline) and sample.yml only calls it (the Deployment).
name: Sample Pipeline

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  haiku:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      OUT: agbredo-out
      HAIKU: samples/haiku-${{ github.run_id }}-${{ github.run_attempt }}.md
      MARKER: "Agbredo-Run: ${{ github.run_id }}/${{ github.run_attempt }}"
      LABEL: ai-agent-generated
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Claude Code sends this token with its telemetry. We get it here,
      # because claude-code-action hides the OIDC variables from Claude.
      # The token expires in minutes; Agbredo accepts it for the whole job.
      - name: Get a telemetry token
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=agbredo" | jq -r .value)
          echo "::add-mask::$token"
          echo "OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer $token" >> "$GITHUB_ENV"

      - name: Agent writes a haiku
        id: agent
        uses: anthropics/claude-code-action@c2d289cca71cda091794983294573dd33f0f6e7a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Write a haiku about watching robots work. Then create these files with the Write tool:
            - ${{ env.HAIKU }}: the haiku.
            - ${{ env.OUT }}/issue-title.txt: one line, a title for an issue that asks for another haiku on the same theme.
            - ${{ env.OUT }}/issue-body.md: two or three sentences for that issue.
            - ${{ env.OUT }}/pr-title.txt: one line, a title for a pull request that adds the haiku.
            - ${{ env.OUT }}/pr-body.md: two or three sentences for that pull request.
            Do not do anything else.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_ENABLE_TELEMETRY": "1",
                "OTEL_METRICS_EXPORTER": "otlp",
                "OTEL_LOGS_EXPORTER": "otlp",
                "OTEL_EXPORTER_OTLP_PROTOCOL": "http/protobuf",
                "OTEL_EXPORTER_OTLP_ENDPOINT": "https://www.agbredo.com/api/otlp",
                "OTEL_METRIC_EXPORT_INTERVAL": "10000",
                "OTEL_LOGS_EXPORT_INTERVAL": "5000",
                "OTEL_RESOURCE_ATTRIBUTES": "github.repository=${{ github.repository }},github.run_id=${{ github.run_id }},github.run_attempt=${{ github.run_attempt }},github.job=${{ github.job }},github.step=agent"
              }
            }
          claude_args: --model claude-haiku-5-5 --allowedTools Write --max-turns 10

      - name: Make sure the label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create "$LABEL" --color BFD4F2 --description "Written by an AI agent, opened by automation" --force

      - name: Open the Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\n%s\n' "$MARKER" >> "$OUT/issue-body.md"
          gh issue create --label "$LABEL" --title "$(head -n 1 "$OUT/issue-title.txt")" --body-file "$OUT/issue-body.md"

      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: sample-pipeline/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf '\n\n%s\n' "$MARKER" >> "$OUT/pr-body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$HAIKU"
          git commit -m "Add a haiku"
          git push origin "$BRANCH"
          gh pr create --head "$BRANCH" --label "$LABEL" --title "$(head -n 1 "$OUT/pr-title.txt")" --body-file "$OUT/pr-body.md"
