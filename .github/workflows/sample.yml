# Uses the Sample Pipeline in this repository. Start it by hand from the Actions tab.
name: Sample

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sample:
    uses: ./.github/workflows/sample-pipeline.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
