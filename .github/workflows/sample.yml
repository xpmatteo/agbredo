# Uses the Sample Pipeline in this repository. Start it by hand from the Actions tab.
#
# This file is the Deployment: it only calls the Pipeline in sample-pipeline.yml.
# Agbredo only shows runs whose workflow_run webhook has a non-empty
# referenced_workflows, and GitHub fills that list only when a workflow calls a
# reusable one. A single workflow doing the work itself would be ignored.
name: Sample

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sample:
    uses: ./.github/workflows/sample-pipeline.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
