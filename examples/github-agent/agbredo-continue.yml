name: Agbredo approved continuation
run-name: "agbredo:${{ inputs.agbredo_correlation_id }}:approval:${{ inputs.agbredo_approval_id }}"

on:
  workflow_dispatch:
    inputs:
      agbredo_run_id:
        description: Agbredo run ID
        required: true
        type: string
      agbredo_correlation_id:
        description: Agbredo correlation ID
        required: true
        type: string
      agbredo_url:
        description: Public HTTPS URL of Agbredo
        required: true
        type: string
      agbredo_approval_id:
        description: Immutable approval request ID
        required: true
        type: string
      agbredo_payload_hash:
        description: Server hash of approved immutable proposal
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: "agbredo-approval-${{ inputs.agbredo_approval_id }}"
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate authorization and execute approved action through Agbredo
        env:
          AGBREDO_RUN_ID: ${{ inputs.agbredo_run_id }}
          AGBREDO_CORRELATION_ID: ${{ inputs.agbredo_correlation_id }}
          AGBREDO_URL: ${{ inputs.agbredo_url }}
          AGBREDO_APPROVAL_ID: ${{ inputs.agbredo_approval_id }}
          AGBREDO_PAYLOAD_HASH: ${{ inputs.agbredo_payload_hash }}
        run: python3 examples/github-agent/agent.py continue
