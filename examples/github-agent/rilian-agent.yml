name: Rilian example agent
run-name: "rilian:${{ inputs.rilian_correlation_id }}:initial"

on:
  workflow_dispatch:
    inputs:
      rilian_run_id:
        description: Rilian run ID
        required: true
        type: string
      rilian_correlation_id:
        description: Rilian correlation ID
        required: true
        type: string
      rilian_url:
        description: Public HTTPS URL of Rilian
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: "rilian-initial-${{ inputs.rilian_correlation_id }}"
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish events and propose an issue
        env:
          RILIAN_RUN_ID: ${{ inputs.rilian_run_id }}
          RILIAN_CORRELATION_ID: ${{ inputs.rilian_correlation_id }}
          RILIAN_URL: ${{ inputs.rilian_url }}
        run: python3 examples/github-agent/agent.py propose
