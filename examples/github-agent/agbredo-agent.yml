name: Agbredo example agent
run-name: "agbredo:${{ inputs.agbredo_correlation_id }}:initial"

on:
  workflow_dispatch:
    inputs:
      agbredo_run_id:
        description: Agbredo run ID
        required: true
        type: string
      agbredo_correlation_id:
        description: Agbredo correlation ID
        required: true
        type: string
      agbredo_url:
        description: Public HTTPS URL of Agbredo
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: "agbredo-initial-${{ inputs.agbredo_correlation_id }}"
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish events and propose an issue
        env:
          AGBREDO_RUN_ID: ${{ inputs.agbredo_run_id }}
          AGBREDO_CORRELATION_ID: ${{ inputs.agbredo_correlation_id }}
          AGBREDO_URL: ${{ inputs.agbredo_url }}
        run: python3 examples/github-agent/agent.py propose
